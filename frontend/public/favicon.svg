<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Navy Blue Rounded Squircle Background -->
  <rect width="100" height="100" rx="24" fill="#0f2238"/>
  
  <!-- Interlocking Star & S Logo in Crisp White -->
  <g stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- Star Upper & Right Facets -->
    <path d="M46 19 L37 54 L17 51 L41 61 L53 83 L63 54 L82 45 L60 41 L53 19 Z"/>
    
    <!-- Central Flowing S-Curve Ribbon -->
    <path d="M44 46 C44 38, 62 38, 62 46 C62 54, 44 54, 44 62 C44 70, 62 70, 62 62" stroke-width="5"/>
    
    <!-- Plus Icon (Top Right) -->
    <path d="M66 31 L74 31 M70 27 L70 35" stroke-width="4.5"/>
    
    <!-- Dot Circle (Bottom Left) -->
    <circle cx="33" cy="69" r="4.5" fill="#ffffff" stroke="none"/>
